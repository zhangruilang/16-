<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="林知远的个人主页，记录生活、文字与灵感。">
  <title>林知远 · 个人主页</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #173251; background: #fff0e9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .page { max-width: 1120px; margin: auto; padding: 36px 48px; min-height: 100svh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    .logo span { color: #2674e8; }
    .label { color: #718399; font-size: 12px; letter-spacing: 2px; }
    main { flex: 1; display: flex; align-items: center; padding: 75px 0; }
    .card { width: 100%; position: relative; overflow: hidden; padding: 80px 64px; background: white; border: 1px solid #e4edf9; border-radius: 28px; box-shadow: 0 24px 70px #205aa00a; }
    .card::after { content: ""; position: absolute; width: 280px; height: 280px; border: 55px solid #edf5ff; border-radius: 50%; right: -90px; top: -100px; pointer-events: none; }
    .content { position: relative; z-index: 1; }
    .avatar { display: grid; place-items: center; width: 64px; height: 64px; background: #eaf3ff; color: #2674e8; border-radius: 20px; font-size: 26px; margin-bottom: 36px; }
    .eyebrow { color: #2674e8; font-size: 12px; font-weight: 600; letter-spacing: 3px; margin: 0 0 18px; }
    h1 { font-size: clamp(36px, 6vw, 62px); line-height: 1.25; letter-spacing: -2px; margin: 0 0 24px; font-weight: 700; }
    h1 span { color: #2674e8; }
    .intro { max-width: 560px; color: #697d94; font-size: 17px; line-height: 1.9; margin: 0; }
    .hobbies { margin-top: 32px; }
    .hobbies h2 { margin: 0 0 14px; font-size: 18px; }
    .hobbies ul { margin: 0; padding-left: 22px; color: #697d94; font-size: 16px; line-height: 2; }
    .hobbies li::marker { color: #2674e8; }
    .divider { width: 42px; height: 3px; background: #2674e8; border-radius: 4px; margin: 35px 0 24px; }
    .note { font-size: 13px; color: #8a9bb0; margin: 0; letter-spacing: 1px; }
    footer { display: flex; justify-content: space-between; gap: 16px; color: #8a9bb0; font-size: 12px; line-height: 1.7; }
    @media (max-width: 600px) { .page { padding: 24px; } .label { font-size: 10px; letter-spacing: 1px; } main { padding: 48px 0; } .card { padding: 48px 28px; border-radius: 22px; } h1 { letter-spacing: -1px; } .intro { font-size: 16px; } footer { flex-direction: column; gap: 4px; } }
  </style>
</head>
<body>
  <div class="page">
    <header><div class="logo">知远<span> .</span></div><span class="label">MY PERSONAL SPACE</span></header>
    <main>
      <section class="card" aria-labelledby="greeting">
        <div class="content">
          <div class="avatar" aria-hidden="true">林</div>
          <p class="eyebrow">欢迎来到我的个人主页</p>
          <h1 id="greeting">你好，我是<span>林知远</span>。</h1>
          <p class="intro">一个热爱文字与生活的创作者，用好奇心探索世界，用简单的表达记录每一份灵感。</p>
          <section class="hobbies" aria-labelledby="hobbies-title">
            <h2 id="hobbies-title">我的爱好</h2>
            <ul>
              <li>阅读：在文字里发现新的世界。</li>
              <li>摄影：记录生活中温柔的瞬间。</li>
              <li>旅行：探索不同城市的风景与故事。</li>
            </ul>
          </section>
          <div class="divider" aria-hidden="true"></div>
          <p class="note">保持好奇，慢慢生长。</p>
        </div>
      </section>
    </main>
    <footer><span>© 2026 林知远</span><span>生活有留白，灵感有回响。</span></footer>
  </div>
</body>
</html>
